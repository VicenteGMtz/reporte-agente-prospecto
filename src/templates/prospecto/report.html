<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Checkup Financiero</title>
  <style>
    /* {{ESTILOS_CSS}} */
  </style>
</head>
<body>

  <!-- PÁGINA 1: PORTADA -->
  <section class="pagina-portada">
    
    <!-- 1. Header con Logo y Fecha -->
    <header class="portada-header">
      <img src="{{LOGO_GNP_SRC}}" alt="GNP Seguros" class="logo-gnp-img" />
      <div class="fecha-analisis">Fecha de análisis: {{FECHA_ANALISIS}}</div>
    </header>

    <!-- 2. Hero Banner -->
    <div class="hero-banner" style="background-image: url('{{FONDO_BANNER_SRC}}');">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-title-box">
          <h1 class="hero-title">{{TITULO_HEADER}}</h1>
        </div>
        <div class="hero-subtitle">{{SUBTITULO_HEADER}}</div>
      </div>
    </div>

    <!-- 3. Franja de Salud Financiera con Tacómetro -->
    <div class="estatus-banner">
      <div class="estatus-frase">{{FRASE_ESTATUS}}</div>
      <div class="estatus-tacometro-container">
        <img src="{{TACOMETRO_IMG_SRC}}" alt="Estatus Tacómetro" class="tacometro-img" />
        <div class="estatus-badge" style="background-color: {{COLOR_BADGE}};">
          {{NOMBRE_ESTATUS}}
        </div>
      </div>
    </div>

    <!-- 4. Datos del Cliente e Ilustración -->
    <footer class="cliente-seccion">
      <div class="cliente-info">
        <h2 class="cliente-nombre">{{CLIENTE_NOMBRE}}</h2>
        <div class="cliente-datos">{{CLIENTE_DEMOGRAFICOS}}</div>
      </div>
      <div class="cliente-ilustracion-box">
        <img src="{{ILUSTRACION_FOCO_SRC}}" alt="Ilustración Financiera" class="cliente-ilustracion-img" />
      </div>
    </footer>

  </section>

</body>
</html>
